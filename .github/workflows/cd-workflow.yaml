name: Continuous Deployment

on: # this wf is run when ci is completed successfully
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # 1 - Check if the CI workflow was successful
    if: github.event.workflow_run.conclusion == 'success'
    
    steps: 
      - name: Checkout code  # 2- check out the code from the repository
        uses: actions/checkout@v2
        # 3- use aws credentials which on github secrets to authenticate with AWS and push the image to ECR        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
        # 4 - set up kubectl to interact with the Kubernetes cluster
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v1
        with:
          version: 'latest'
            # 5- verify kubectl is installed and can interact with the cluster
      - name: Verify kubectl
        run: |
          kubectl version --client
        # 6 - deploy the application to Kubernetes using the manifests in the k8s directory
      - name: Deploy to Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG_SECRET }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl apply -f k8s