name: Continuous Integration
on:
  push:
    branches: [ main ] # Trigger the workflow on pushes to the main branch

jobs:

  build: # name of job : build and run on ubuntu-latest vm
    name: Build image
    runs-on: ubuntu-latest

    steps:
    - name: Check out code # first step is to check out the code from the repository
      uses: actions/checkout@v2
      # use aws credentials which on github secrets to authenticate with AWS and push the image to ECR
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1
        #to login to ECR and get the login token
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
        #then build and push for docker image on ecr 
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: goapp-survey
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./Go-app/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG